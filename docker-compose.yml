# Local AI Data Intelligence Platform - Docker Compose
#
# Usage:
#   docker compose up                    # development (mock DB, no VPN)
#   docker compose --profile vpn up     # single VPN (e.g. Oracle only)
#   docker compose --profile vpn-multi up # multi-VPN (per-database VPN routing)
#
# VPN files (single or multi):
#   docker/vpn/auth.txt               # shared credentials (fallback)
#   docker/vpn/oracle.ovpn            # OpenVPN config for Oracle
#   docker/vpn/auth_oracle.txt        # credentials for oracle.ovpn
#   docker/vpn/mysql.ovpn             # OpenVPN config for MySQL
#   docker/vpn/auth_mysql.txt         # credentials for mysql.ovpn
#   docker/vpn/postgres.ovpn          # OpenVPN config for PostgreSQL
#   docker/vpn/auth_postgres.txt      # credentials for postgres.ovpn
#
# Routing via env vars:
#   ORACLE_SUBNETS=10.11.0.0/16           # subnets routed via oracle.ovpn tunnel
#   MYSQL_SUBNETS=192.168.50.0/24         # subnets routed via mysql.ovpn tunnel
#   POSTGRES_SUBNETS=172.16.0.0/12       # subnets routed via postgres.ovpn tunnel
#   SINGLE_VPN_SUBNETS=10.11.0.0/16      # subnets for single-vpn mode

name: localai

x-backend-common: &backend-common
  build:
    context: .
    dockerfile: Dockerfile.backend
  image: localai/backend:latest
  container_name: localai-backend
  restart: unless-stopped
  environment:
    APP_NAME: ${APP_NAME:-Local AI Platform}
    APP_SHORT_NAME: ${APP_SHORT_NAME:-LocalAI}
    APP_TAGLINE: ${APP_TAGLINE:-Internal AI for Data Intelligence}
    APP_INSTITUTION: ${APP_INSTITUTION:-}
    APP_DOMAIN: ${APP_DOMAIN:-data}
    APP_VERSION: ${APP_VERSION:-1.0.0}
    LLM_BACKEND: ${LLM_BACKEND:-ollama}
    LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434}
    LLM_MODEL: ${LLM_MODEL:-local-ai:latest}
    LLM_TIMEOUT: ${LLM_TIMEOUT:-120}
    QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
    EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
    JWT_SECRET: ${JWT_SECRET:-change-me-in-production-please}
    JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
    JWT_ACCESS_EXPIRE_MIN: ${JWT_ACCESS_EXPIRE_MIN:-15}
    CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000","http://localhost:3001"]}
    STORAGE_DB_PATH: ${STORAGE_DB_PATH:-/app/data/app.db}
    USE_MOCK_DB: ${USE_MOCK_DB:-1}
    # Oracle
    ORACLE_BATAMAI_HOST: ${ORACLE_BATAMAI_HOST:-}
    ORACLE_BATAMAI_PORT: ${ORACLE_BATAMAI_PORT:-1521}
    ORACLE_BATAMAI_SERVICE: ${ORACLE_BATAMAI_SERVICE:-}
    ORACLE_BATAMAI_USER: ${ORACLE_BATAMAI_USER:-}
    ORACLE_BATAMAI_PASSWORD: ${ORACLE_BATAMAI_PASSWORD:-}
    # PostgreSQL
    POSTGRES_PRIMARY_HOST: ${POSTGRES_PRIMARY_HOST:-}
    POSTGRES_PRIMARY_PORT: ${POSTGRES_PRIMARY_PORT:-5432}
    POSTGRES_PRIMARY_DB: ${POSTGRES_PRIMARY_DB:-}
    POSTGRES_PRIMARY_USER: ${POSTGRES_PRIMARY_USER:-}
    POSTGRES_PRIMARY_PASSWORD: ${POSTGRES_PRIMARY_PASSWORD:-}

    # RAG (optional — only used when --profile rag is active)
    RAG_BASE_URL: ${RAG_BASE_URL:-http://rag:8002}
    EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
    # MySQL
    MYSQL_PRIMARY_HOST: ${MYSQL_PRIMARY_HOST:-}
    MYSQL_PRIMARY_PORT: ${MYSQL_PRIMARY_PORT:-3306}
    MYSQL_PRIMARY_DB: ${MYSQL_PRIMARY_DB:-}
    MYSQL_PRIMARY_USER: ${MYSQL_PRIMARY_USER:-}
    MYSQL_PRIMARY_PASSWORD: ${MYSQL_PRIMARY_PASSWORD:-}
    PYTHONUNBUFFERED: "1"
  depends_on:
    qdrant:
      condition: service_started
    ollama:
      condition: service_started
  # Optional RAG service (port 8002) — when active, backend proxies to it.
  # For the rag service to be available, run: docker compose --profile rag up
  depends_on_rag: &depends_on_rag
    rag:
      condition: service_started
      required: false
  volumes:
    - app_data:/app/data
  extra_hosts:
    - "host.docker.internal:host-gateway"
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 15s

services:
  # ── Backend API (standard — no VPN) ───────────────────────────────────
  backend:
    <<: *backend-common
    ports:
      - "${API_PORT:-8000}:8000"
    networks:
      - localai-net

  # ── Frontend ───────────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_APP_NAME: ${APP_NAME:-Local AI Platform}
        NEXT_PUBLIC_APP_TAGLINE: ${APP_TAGLINE:-Internal AI for Data Intelligence}
    image: localai/frontend:latest
    container_name: localai-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - localai-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── Qdrant ─────────────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: localai-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - localai-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:6333/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Ollama ─────────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: localai-ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - localai-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ════════════════════════════════════════════════════════════════════════
  # VPN SERVICES — activate with --profile
  # ════════════════════════════════════════════════════════════════════════

  # ── RAG service (optional — for Perda/Pergub/SOP ingestion) ────────────
  # Activate with: docker compose --profile rag up
  # Provides /ingest, /search, /documents endpoints to the backend.
  rag:
    profiles: ["rag"]
    build:
      context: ./rag
      dockerfile: Dockerfile
      args:
        EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
    image: localai/rag:latest
    container_name: localai-rag
    restart: unless-stopped
    environment:
      QDRANT_URL: http://qdrant:6333
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      HF_HOME: /app/.cache/hf
      TRANSFORMERS_CACHE: /app/.cache/hf
    depends_on:
      qdrant:
        condition: service_started
    volumes:
      - rag_models:/app/.cache/hf  # pre-downloaded embedding models
    networks:
      - localai-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s  # sentence-transformers model load on first start

  # When RAG profile is active, backend can reach it at http://rag:8002
  # We pass RAG_BASE_URL via env override (in profile-specific override file
  # or by setting RAG_BASE_URL in your .env when running with --profile rag).

  # ── Single VPN (one .ovpn file) ────────────────────────────────────────
  # Use when only ONE database needs VPN.
  # Backend connects via network_mode: "service:vpn".
  # Files: docker/vpn/config.ovpn  +  docker/vpn/auth.txt
  # Routes: SINGLE_VPN_SUBNETS (comma-separated CIDRs)
  vpn:
    profiles: ["vpn"]
    build:
      context: ./docker/vpn
      dockerfile: Dockerfile
    image: localai/vpn:latest
    container_name: localai-vpn
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    volumes:
      - ./docker/vpn/config.ovpn:/vpn/config.ovpn:ro
      - ./docker/vpn/auth.txt:/vpn/auth.txt:ro
    environment:
      VPN_SUBNETS: ${SINGLE_VPN_SUBNETS:-}
    networks:
      - localai-net
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/run/openvpn.pid && kill -0 $(cat /var/run/openvpn.pid) || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── Multi-VPN (per-database VPN routing) ────────────────────────────────
  # Use when multiple databases each need their own VPN tunnel.
  # Each .ovpn file in docker/vpn/ gets its own tun interface (tun10, tun11...).
  # iptables policy routing sends traffic to the right tunnel by destination subnet.
  #
  # File naming convention:
  #   docker/vpn/<name>.ovpn           → OpenVPN config for tunnel <name>
  #   docker/vpn/auth_<name>.txt        → credentials for <name>.ovpn
  #   docker/vpn/auth.txt              → fallback credentials (if auth_<name>.txt missing)
  #
  # Subnet routing via env vars (match .ovpn basename to DB env prefix):
  #   ORACLE_SUBNETS=10.11.0.0/16        → oracle.ovpn handles 10.11.x.x
  #   MYSQL_SUBNETS=192.168.50.0/24      → mysql.ovpn handles 192.168.50.x
  #   POSTGRES_SUBNETS=172.16.0.0/12    → postgres.ovpn handles 172.16-31.x.x
  #
  # Example: Oracle (VPN A) + MySQL (VPN B)
  #   docker/vpn/oracle.ovpn   + docker/vpn/auth_oracle.txt
  #   docker/vpn/mysql.ovpn    + docker/vpn/auth_mysql.txt
  #   ORACLE_SUBNETS=10.11.0.0/16
  #   MYSQL_SUBNETS=192.168.50.0/24
  vpn-multi:
    profiles: ["vpn-multi"]
    build:
      context: ./docker/vpn
      dockerfile: Dockerfile
      args:
        ENTRYPOINT: entrypoint-multi.sh
    image: localai/vpn-multi:latest
    container_name: localai-vpn-multi
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    volumes:
      - ./docker/vpn:/vpn:ro
    environment:
      ORACLE_SUBNETS: ${ORACLE_SUBNETS:-}
      MYSQL_SUBNETS: ${MYSQL_SUBNETS:-}
      POSTGRES_SUBNETS: ${POSTGRES_SUBNETS:-}
      # Generic DB_N_SUBNETS for any additional DB:
      # match basename of your .ovpn file to DB_<NAME>_SUBNETS env var
    networks:
      - localai-net
    healthcheck:
      test: ["CMD-SHELL", "ip link show tun10 2>/dev/null || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── VPN-attached backend (shares VPN network namespace) ─────────────────
  # Stops the standard `backend` container when a VPN profile is active.
  # Backend traffic (Oracle, MySQL, PostgreSQL connections) goes through the
  # VPN tunnel(s) in whichever vpn service is running.
  #
  # How it works:
  #   network_mode: "service:vpn"        ← single-VPN mode (profile vpn)
  #   network_mode: "service:vpn-multi" ← multi-VPN mode (profile vpn-multi)
  # The backend process sees the tun interface(s) from the VPN container.
  backend-vpn:
    <<: *backend-common
    profiles: ["vpn", "vpn-multi"]
    container_name: localai-backend-vpn
    # Attach to whichever VPN service is running (single or multi)
    network_mode: "service:${VPN_SERVICE:-vpn}"
    depends_on:
      vpn:
        condition: service_healthy
      qdrant:
        condition: service_started
      ollama:
        condition: service_started
    ports: []  # not exposed; access via frontend or reverse proxy

networks:
  localai-net:
    driver: bridge

volumes:
  qdrant_data:
  ollama_data:
  app_data:
  rag_models:
