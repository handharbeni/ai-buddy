[supervisord]
nodaemon=true
user=root
logfile=/app/logs/supervisord.log
pidfile=/app/logs/supervisord.pid

[program:ollama]
command=/usr/local/bin/ollama serve
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/app/logs/ollama.stdout.log
stderr_logfile=/app/logs/ollama.stderr.log
environment=OLLAMA_HOST="127.0.0.1",OLLAMA_PORT="11434",OLLAMA_MODELS="/app/data/models"

[program:qdrant]
command=/opt/qdrant/qdrant --storage-path /app/data/qdrant --http-port 6333
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/app/logs/qdrant.stdout.log
stderr_logfile=/app/logs/qdrant.stderr.log

[program:backend]
command=/opt/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
directory=/app/backend
autostart=true
autorestart=true
startsecs=10
stdout_logfile=/app/logs/backend.stdout.log
stderr_logfile=/app/logs/backend.stderr.log
environment=LLM_BACKEND="ollama",LLM_BASE_URL="http://127.0.0.1:11434",LLM_MODEL="local-ai:latest",QDRANT_URL="http://127.0.0.1:6333"

[program:frontend]
command=npm run dev -- --port 3000 --hostname 0.0.0.0
directory=/app/frontend
autostart=true
autorestart=true
startsecs=15
stdout_logfile=/app/logs/frontend.stdout.log
stderr_logfile=/app/logs/frontend.stderr.log
environment=NEXT_PUBLIC_API_URL="http://localhost:8000"