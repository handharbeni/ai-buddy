# All-in-One Compose for Local AI Platform
# For development/testing only - not production

name: localai-allinone

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.allinone
    image: localai/allinone:latest
    container_name: localai-allinone
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
      - "${API_PORT:-8000}:8000"
      - "${OLLAMA_PORT:-11434}:11434"
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - app_data:/app/data
      - ollama_data:/root/.ollama
      - qdrant_data:/opt/qdrant/data
      - ./frontend:/app/frontend:ro
      - ./backend:/app/backend:ro
      - ./rag:/app/rag:ro
      - ./Modelfile.bapenda:/app/Modelfile.bapenda:ro
    environment:
      APP_NAME: ${APP_NAME:-Local AI Platform}
      APP_TAGLINE: ${APP_TAGLINE:-Internal AI for Data Intelligence}
      APP_INSTITUTION: ${APP_INSTITUTION:-}
      APP_DOMAIN: ${APP_DOMAIN:-data}
      APP_VERSION: ${APP_VERSION:-1.0.0}

      LLM_BACKEND: ${LLM_BACKEND:-ollama}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://127.0.0.1:11434}
      LLM_MODEL: ${LLM_MODEL:-local-ai:latest}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-120}

      QDRANT_URL: ${QDRANT_URL:-http://127.0.0.1:6333}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}

      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-please}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_EXPIRE_MIN: ${JWT_ACCESS_EXPIRE_MIN:-15}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000","http://localhost:3001"]}
      STORAGE_DB_PATH: ${STORAGE_DB_PATH:-/app/data/app.db}
      USE_MOCK_DB: ${USE_MOCK_DB:-1}

      ORACLE_BATAMAI_HOST: ${ORACLE_BATAMAI_HOST:-}
      ORACLE_BATAMAI_PORT: ${ORACLE_BATAMAI_PORT:-1521}
      ORACLE_BATAMAI_SERVICE: ${ORACLE_BATAMAI_SERVICE:-}
      ORACLE_BATAMAI_USER: ${ORACLE_BATAMAI_USER:-}
      ORACLE_BATAMAI_PASSWORD: ${ORACLE_BATAMAI_PASSWORD:-}

      MYSQL_PRIMARY_HOST: ${MYSQL_PRIMARY_HOST:-}
      MYSQL_PRIMARY_PORT: ${MYSQL_PRIMARY_PORT:-3306}
      MYSQL_PRIMARY_DB: ${MYSQL_PRIMARY_DB:-}
      MYSQL_PRIMARY_USER: ${MYSQL_PRIMARY_USER:-}
      MYSQL_PRIMARY_PASSWORD: ${MYSQL_PRIMARY_PASSWORD:-}

      POSTGRES_PRIMARY_HOST: ${POSTGRES_PRIMARY_HOST:-}
      POSTGRES_PRIMARY_PORT: ${POSTGRES_PRIMARY_PORT:-5432}
      POSTGRES_PRIMARY_DB: ${POSTGRES_PRIMARY_DB:-}
      POSTGRES_PRIMARY_USER: ${POSTGRES_PRIMARY_USER:-}
      POSTGRES_PRIMARY_PASSWORD: ${POSTGRES_PRIMARY_PASSWORD:-}

      VPN_SUBNETS: ${VPN_SUBNETS:-10.11.0.0/16}
      ORACLE_SUBNETS: ${ORACLE_SUBNETS:-}
      MYSQL_SUBNETS: ${MYSQL_SUBNETS:-}
      POSTGRES_SUBNETS: ${POSTGRES_SUBNETS:-}
      SINGLE_VPN_SUBNETS: ${SINGLE_VPN_SUBNETS:-}

      DEBUG: ${DEBUG:-false}
      FEATURE_RAG_ENABLED: ${FEATURE_RAG_ENABLED:-true}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: "2.0"

volumes:
  app_data:
  ollama_data:
  qdrant_data: